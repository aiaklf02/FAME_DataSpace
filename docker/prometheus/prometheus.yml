# FAME Financial Data Space - Prometheus Configuration
# Scraping metrics from all available services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'fame-dataspace-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # ═══════════════════════════════════════════════════════════════
  # PROMETHEUS - Self-monitoring
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          zone: 'monitoring'

  # ═══════════════════════════════════════════════════════════════
  # PUSHGATEWAY - Receives metrics pushed from streaming application
  # This is the main source for real-time streaming metrics
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'pushgateway'
    honor_labels: true
    scrape_interval: 5s
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: 'pushgateway'
          zone: 'streaming'

  # ═══════════════════════════════════════════════════════════════
  # POSTGRESQL EXPORTER - Database metrics
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          zone: 'database'

  # ═══════════════════════════════════════════════════════════════
  # REDIS EXPORTER - Cache metrics
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          zone: 'cache'

  # ═══════════════════════════════════════════════════════════════
  # GRAFANA - Dashboard metrics
  # ═══════════════════════════════════════════════════════════════
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          zone: 'monitoring'
    metrics_path: /metrics
