# FAME Financial Data Space - Prometheus Configuration
# Scraping metrics from all services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'fame-dataspace-monitor'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # MinIO Data Lake metrics
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'datalake'
          zone: 'storage'

  # Kafka metrics (JMX)
  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9999']
        labels:
          service: 'kafka'
          zone: 'streaming'

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
          zone: 'database'

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'
          zone: 'cache'

  # FAME Application
  - job_name: 'fame-elt'
    static_configs:
      - targets: ['fame-elt:8000']
        labels:
          service: 'elt-pipeline'
          zone: 'application'

  # Traefik API Gateway
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8082']
        labels:
          service: 'gateway'
          zone: 'network'
