# FAME Financial Data Space - Grafana Datasources Provisioning

apiVersion: 1

datasources:
  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL - Main FAME Database
  # Credentials must match docker-compose.yml postgres service
  # ═══════════════════════════════════════════════════════════════
  - name: PostgreSQL
    type: grafana-postgresql-datasource
    uid: postgres
    url: postgres:5432
    database: fame_transactions
    user: fame_user
    secureJsonData:
      password: fame_password
    jsonData:
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: true

  # ═══════════════════════════════════════════════════════════════
  # Prometheus - Real-time Metrics for Streaming Data
  # Scrapes metrics from pushgateway and exporters
  # ═══════════════════════════════════════════════════════════════
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    access: proxy
    jsonData:
      httpMethod: POST
      timeInterval: "5s"
    isDefault: false
    editable: true
