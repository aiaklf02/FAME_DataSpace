# FAME Financial Data Space - Grafana Datasources Provisioning

apiVersion: 1

datasources:
  # ═══════════════════════════════════════════════════════════════
  # PostgreSQL - Toutes les données FAME
  # ═══════════════════════════════════════════════════════════════
  - name: PostgreSQL
    type: grafana-postgresql-datasource
    uid: postgres
    url: fame-postgres:5432
    database: fame_transactions
    user: fame_user
    secureJsonData:
      password: fame_password
    jsonData:
      sslmode: disable
      maxOpenConns: 100
      maxIdleConns: 100
      maxIdleConnsAuto: true
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: true
