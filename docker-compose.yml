# ═══════════════════════════════════════════════════════════════════════════════
# FAME Financial Data Space - Complete Infrastructure
# ═══════════════════════════════════════════════════════════════════════════════
# Architecture: Data Lake + Data Fabric + Data Warehouse + Streaming (EtLT)
# 
# 🌟 CORE SERVICES:
# ✅ Apache Kafka + Zookeeper (Real-time Streaming)
# ✅ Apache Spark (Stream Processing)
# ✅ PostgreSQL (Transactions Database)
# ✅ Redis (Caching Layer)
# ✅ Apache Fuseki (RDF/SPARQL Semantic Layer)
# ✅ Metabase (BI Analytics & Dashboards)
# ═══════════════════════════════════════════════════════════════════════════════

services:
  # ════════════════════════════════════════════════════════════════════════════
  # 🔄 STREAMING LAYER - Apache Kafka
  # ════════════════════════════════════════════════════════════════════════════
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fame-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fame-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fame-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - fame-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fame-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fame-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - fame-network

  # ════════════════════════════════════════════════════════════════════════════
  # ⚡ STREAM PROCESSING - Apache Spark
  # ════════════════════════════════════════════════════════════════════════════
  
  spark-master:
    image: apache/spark:3.5.0
    container_name: fame-spark-master
    command: bash -c "/opt/spark/sbin/start-master.sh && tail -f /opt/spark/logs/*"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8081:8080"
      - "7077:7077"
    networks:
      - fame-network

  spark-worker:
    image: apache/spark:3.5.0
    container_name: fame-spark-worker
    command: bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    environment:
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_NO_DAEMONIZE=true
    depends_on:
      - spark-master
    networks:
      - fame-network

  # ════════════════════════════════════════════════════════════════════════════
  # 🗃️ DATABASE - PostgreSQL
  # ════════════════════════════════════════════════════════════════════════════
  
  postgres:
    image: postgres:15-alpine
    container_name: fame-postgres
    environment:
      POSTGRES_DB: fame_transactions
      POSTGRES_USER: fame_user
      POSTGRES_PASSWORD: fame_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fame-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fame_user -d fame_transactions"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # ⚡ CACHING LAYER - Redis
  # ════════════════════════════════════════════════════════════════════════════
  
  redis:
    image: redis:7-alpine
    container_name: fame-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - fame-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # 🔗 SEMANTIC LAYER - Apache Jena Fuseki (RDF/SPARQL)
  # ════════════════════════════════════════════════════════════════════════════
  
  fuseki:
    image: stain/jena-fuseki:latest
    container_name: fame-fuseki
    environment:
      ADMIN_PASSWORD: admin123
      JVM_ARGS: -Xmx2g
      FUSEKI_DATASET_1: fame
    ports:
      - "3030:3030"
    volumes:
      - fuseki-data:/fuseki
      # Mount Protege semantic files for auto-loading
      - ./semantic/fame_data_protege.owl:/fuseki/data/ontology/fame_data_protege.owl:ro
      - ./semantic/FAME-RDF.rdf:/fuseki/data/rdf/FAME-RDF.rdf:ro
      - ./semantic/FAME-SKOS.ttl:/fuseki/data/vocabulary/FAME-SKOS.ttl:ro
      - ./semantic/fame_ontology.owl:/fuseki/data/ontology/fame_ontology.owl:ro
    networks:
      - fame-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ════════════════════════════════════════════════════════════════════════════
  # 📊 GRAFANA - Dashboards & Monitoring (Auto-Provisioned)
  # ════════════════════════════════════════════════════════════════════════════
  
  grafana:
    image: grafana/grafana:latest
    container_name: fame-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fame-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fame-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # 📈 PROMETHEUS - Metrics Collection
  # ════════════════════════════════════════════════════════════════════════════
  
  prometheus:
    image: prom/prometheus:latest
    container_name: fame-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - fame-network

  pushgateway:
    image: prom/pushgateway:latest
    container_name: fame-pushgateway
    ports:
      - "9091:9091"
    networks:
      - fame-network

  # ════════════════════════════════════════════════════════════════════════════
  # 📊 METRICS EXPORTERS - For Prometheus Scraping
  # ════════════════════════════════════════════════════════════════════════════
  
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: fame-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://fame_user:fame_password@postgres:5432/fame_transactions?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fame-network
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: fame-redis-exporter
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - fame-network
    restart: unless-stopped

# ════════════════════════════════════════════════════════════════════════════
# 🔧 NETWORKS & VOLUMES
# ════════════════════════════════════════════════════════════════════════════

networks:
  fame-network:
    driver: bridge
    name: fame-dataspace-network

volumes:
  postgres-data:
    name: fame-postgres-data
  fuseki-data:
    name: fame-fuseki-data
  redis-data:
    name: fame-redis-cache
  grafana-data:
    name: fame-grafana-data
  prometheus-data:
    name: fame-prometheus-data
